name: EchoFarm CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: echofarm-core/go.mod
          cache-dependency-path: echofarm-core/go.sum

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET bridge
        run: dotnet restore stardew-echo-mod/EchoFarm.sln

      - name: Test .NET bridge
        run: dotnet test stardew-echo-mod/EchoFarm.sln --no-restore

      - name: Test and vet Go core
        working-directory: echofarm-core
        run: |
          go test -race -count=1 ./...
          go vet ./...

      - name: Run cross-process demo
        run: ./demo/run-core-demo.sh

      - name: Run four-day Continuum demo
        run: ./demo/run-continuum-demo.sh

      - name: Run reflective experience demo
        run: ./demo/run-reflective-demo.sh

      - name: Validate Nexus packaging
        run: ./scripts/tests/package-nexus-smoke.sh

  windows-sidecar:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: echofarm-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: echofarm-core/go.mod
          cache-dependency-path: echofarm-core/go.sum

      - name: Test and build Windows sidecar
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          go build -trimpath -ldflags "-s -w -buildid=" -o "$env:RUNNER_TEMP\echofarm-core.exe" ./cmd/echofarm

      - name: Test Windows doctor, package, install, and uninstall
        shell: pwsh
        working-directory: .
        run: pwsh -NoProfile -File scripts/windows/Test-EchoFarmSetup.ps1

      - name: Smoke Windows sidecar health
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ECHOFARM_MODEL_MODE = "fixture"
          $env:ECHOFARM_ADDRESS = "127.0.0.1:18474"
          $env:ECHOFARM_DATABASE_PATH = "$env:RUNNER_TEMP\echofarm-ci.db"
          $stdout = "$env:RUNNER_TEMP\echofarm-stdout.log"
          $stderr = "$env:RUNNER_TEMP\echofarm-stderr.log"
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\echofarm-core.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            foreach ($attempt in 1..80) {
              if ($process.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "EchoFarm sidecar exited before becoming healthy with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18474/healthz" -TimeoutSec 2
                if ($response.status -eq "ok") {
                  $healthy = $true
                  break
                }
              }
              catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthy) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "EchoFarm sidecar did not become healthy."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
