name: EchoFarm CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: echofarm-core/go.mod
          cache-dependency-path: echofarm-core/go.sum

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET bridge
        run: dotnet restore stardew-echo-mod/EchoFarm.sln

      - name: Test .NET bridge
        run: dotnet test stardew-echo-mod/EchoFarm.sln --no-restore

      - name: Test and vet Go core
        working-directory: echofarm-core
        run: |
          go test -race -count=1 ./...
          go vet ./...

      - name: Run cross-process demo
        run: ./demo/run-core-demo.sh

      - name: Run four-day Continuum demo
        run: ./demo/run-continuum-demo.sh

      - name: Run reflective experience demo
        run: ./demo/run-reflective-demo.sh

      - name: Run semantic activity learning demo
        run: ./demo/run-activity-learning-demo.sh

      - name: Test LAN setup scripts
        run: ./scripts/tests/test-lan-scripts.sh

      - name: Run TLS Kitex LAN relay demo
        run: ./demo/run-lan-relay-demo.sh

      - name: Validate Nexus packaging
        run: ./scripts/tests/package-nexus-smoke.sh

  windows-sidecar:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: echofarm-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: echofarm-core/go.mod
          cache-dependency-path: echofarm-core/go.sum

      - name: Test and build Windows sidecar
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          go build -trimpath -ldflags "-s -w -buildid=" -o "$env:RUNNER_TEMP\echofarm-core.exe" ./cmd/echofarm
          go build -trimpath -ldflags "-s -w -buildid=" -o "$env:RUNNER_TEMP\echofarm-relay.exe" ./cmd/echofarm-relay

      - name: Test secret-safe relay setup
        shell: pwsh
        working-directory: .
        run: pwsh -NoProfile -File scripts/windows/Test-EchoFarmRelaySetup.ps1

      - name: Test Windows doctor, package, install, and uninstall
        shell: pwsh
        working-directory: .
        run: pwsh -NoProfile -File scripts/windows/Test-EchoFarmSetup.ps1

      - name: Smoke Windows sidecar health
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\scripts\windows\EchoFarm.Setup.psm1 -Force
          $result = Test-EchoFarmCoreHealth -CoreExecutablePath "$env:RUNNER_TEMP\echofarm-core.exe"
          $result | ConvertTo-Json -Depth 8
          if (-not $result.Ready) {
            throw "EchoFarm sidecar health verification failed: $($result.Issues.Code -join ', ')"
          }

      - name: Upload Windows relay
        uses: actions/upload-artifact@v4
        with:
          name: echofarm-relay-windows-amd64
          path: ${{ runner.temp }}/echofarm-relay.exe
          if-no-files-found: error
